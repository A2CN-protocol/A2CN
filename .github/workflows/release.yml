name: Release

# Pushing a vX.Y.Z tag builds, tests and smoke-tests both packages from the
# tagged commit, then publishes them: the Python package to PyPI and the
# TypeScript package to npm, each through trusted publishing (OIDC), from a job
# gated by its own GitHub environment. RELEASING.md has the steps and the
# one-time setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.23"
  NODE_VERSION: "22"
  NPM_VERSION: "11.21.2"

jobs:
  check:
    name: Tag matches both package versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: false
      - name: Compare the tag with pyproject.toml and package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          python_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("reference-implementation/python/pyproject.toml", "rb"))["project"]["version"])')"
          npm_version="$(node -p 'require("./reference-implementation/typescript/package.json").version')"
          echo "tag: $tag_version, pyproject.toml: $python_version, package.json: $npm_version"
          if [ "$tag_version" != "$python_version" ] || [ "$tag_version" != "$npm_version" ]; then
            echo "::error::The tag $TAG does not match pyproject.toml ($python_version) and package.json ($npm_version)"
            exit 1
          fi

  build-python:
    name: Build and smoke-test the Python package
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: reference-implementation/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.11"
          enable-cache: false
      - run: uv sync --frozen --all-extras
      - run: uv run --frozen --all-extras python -m pytest -q
      - run: uv build --out-dir dist
      - run: uvx twine@7.0.0 check --strict dist/*
      - run: uv run --no-project python scripts/smoke_wheel.py dist/*.whl --workdir "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: reference-implementation/python/dist/
          if-no-files-found: error

  build-npm:
    name: Build and smoke-test the npm package
    needs: check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: reference-implementation/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          package-manager-cache: false
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run
      - run: mkdir -p "$RUNNER_TEMP/npm-dist" && npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
      - run: node scripts/smoke_pack.mjs "$RUNNER_TEMP"/npm-dist/a2cn-*.tgz --workdir "$RUNNER_TEMP/smoke"
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: ${{ runner.temp }}/npm-dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [check, build-python, build-npm]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/a2cn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-npm:
    name: Publish to npm
    needs: [check, build-python, build-npm]
    # npm adds a trusted publisher only to a package that already exists, so
    # the first version is published by hand; the maintainer then sets this
    # repository variable (RELEASING.md, one-time setup).
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/a2cn
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later, newer than Node 22's bundled npm.
      - run: npm install --global "npm@$NPM_VERSION"
      - run: npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: npm-dist/
      # The tarball is the one built and smoke-tested above; nothing is rebuilt.
      - run: |
          tarball="$(ls npm-dist/a2cn-*.tgz)"
          npm publish "./$tarball" --provenance --access public --ignore-scripts
