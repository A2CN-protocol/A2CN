[build-system]
# setuptools 77 is the first to accept a PEP 639 licence expression in
# project.license and project.license-files; 76.1 rejects them.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a2cn"
version = "0.3.2"
description = "Reference implementation of A2CN, the open protocol for agent-to-agent B2B commercial negotiation"
readme = "README.pypi.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Avinash Saraff" }, { name = "Christian Magorrian" }]
keywords = ["a2cn", "agents", "negotiation", "b2b", "procurement", "protocol", "did", "signatures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
]
# Ranges, not pins: each floor is at or above the release that fixes its known
# advisories, and uv.lock holds the exact versions the tests run against.
# starlette is stated directly so its floor holds whatever fastapi allows. jcs
# is capped because canonical bytes are signature-critical; httpx is capped
# because the address-policy transport in a2cn/did.py replaces its private
# connection pool, and a2cn/did.py imports httpcore directly.
dependencies = [
    "fastapi>=0.133.0",
    "starlette>=1.3.1",
    "uvicorn>=0.32",
    "httpx>=0.27,<0.29",
    "httpcore>=1.0.9,<2",
    "PyJWT>=2.15.0",
    "cryptography>=50.0.0",
    "jcs>=0.2.1,<0.4",
    "jsonschema>=4.26",
]

[project.urls]
Homepage = "https://a2cn.io"
Source = "https://github.com/A2CN-protocol/A2CN"
Issues = "https://github.com/A2CN-protocol/A2CN/issues"
Changelog = "https://github.com/A2CN-protocol/A2CN/blob/main/CHANGELOG.md"
"Security policy" = "https://github.com/A2CN-protocol/A2CN/blob/main/SECURITY.md"

[project.scripts]
a2cn-verify = "a2cn.verify:main"

[project.optional-dependencies]
# The MCP server (mcp_server.py). mcp is capped below 2 because mcp 2 renames
# FastMCP; mcp 1.30 and later work with pydantic 2.14, so pydantic is not capped.
mcp = [
    "mcp>=1.30,<2",
]
dev = [
    "a2cn[mcp]",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3",
    "python-multipart>=0.0.31",
    "respx>=0.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["a2cn*"]
