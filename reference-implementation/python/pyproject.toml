[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2cn"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.32.0",
    "httpx==0.27.0",
    "PyJWT==2.9.0",
    "cryptography==43.0.0",
    "jcs==0.2.1",
    "jsonschema==4.26.0",
]

[project.scripts]
a2cn-verify = "a2cn.verify:main"

[project.optional-dependencies]
# The MCP server (mcp_server.py). pydantic is capped because mcp 1.12.4 imports a
# private pydantic helper that 2.14 removed; the mcp releases that work with
# pydantic 2.14 require httpx and PyJWT newer than the core pins above.
mcp = [
    "mcp==1.12.4",
    "pydantic<2.14",
]
dev = [
    "a2cn[mcp]",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "python-multipart==0.0.12",
    "respx==0.21.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["a2cn*"]
